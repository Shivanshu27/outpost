name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a test reach the network. Source contract tests run against
  # captured fixtures; anything trying to reach a real board is a bug we want
  # to fail loudly in CI rather than discover later as flakiness.
  OUTPOST_LLM__PROVIDER: none

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy

      # The layering in ADR-0003 and the composition root in ADR-0009 are
      # architecture decisions. Without this step they are only conventions,
      # and conventions decay silently between reviews.
      - name: Architecture contracts
        run: uv run lint-imports

      - name: Test
        run: uv run pytest -m "not live" --cov=outpost --cov-report=term-missing

      - name: Coverage gate
        run: uv run coverage report --fail-under=70

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A lockfile generated behind a corporate npm mirror carries that
      # mirror's URLs. It leaks an internal hostname and resolves for nobody
      # outside that network — the failure looks like an npm bug, not a config
      # problem, so it is worth catching mechanically. This repo shipped 288
      # such URLs before the Docker build exposed them.
      - name: Lockfile uses the public registry only
        working-directory: web
        run: |
          set -euo pipefail
          if grep -oE '"resolved": "https?://[^/]+' package-lock.json \
             | grep -v 'registry.npmjs.org' | sort -u | grep . ; then
            echo "::error::package-lock.json resolves packages from a non-public registry (see above). Regenerate it with: rm -rf node_modules package-lock.json && npm install --registry=https://registry.npmjs.org/"
            exit 1
          fi
          echo "All packages resolve from registry.npmjs.org."

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image is built here rather than only locally because the frontend
      # stage needs more memory than a constrained Docker host reliably has —
      # it fails there with npm's "Exit handler never called!", which is an
      # OOM in disguise. A hosted runner has the headroom, so this job is what
      # actually keeps the Docker path honest.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: outpost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not the same as working. Prove the entrypoint runs and the
      # SPA actually made it into the image.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm outpost:ci --help > /dev/null
          docker run --rm --entrypoint sh outpost:ci -c \
            'test -f /app/src/outpost/resources/web/index.html'
          echo "Image runs and ships the built UI."

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Outpost's database holds its user's entire job-search history, and the
      # config directory holds their resume. A contributor accidentally
      # committing either is the worst outcome this project has, and it is
      # unrecoverable once it reaches history — so it is checked mechanically
      # rather than left to .gitignore and good intentions.
      - name: Reject personal data and databases
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(db|sqlite3?)$|(^|/)(data|exports)/|resume|profile\.ya?ml|^\.env$'; then
            echo "::error::Personal data or a database is tracked in git. See .gitignore."
            exit 1
          fi
          echo "No personal data tracked."

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
