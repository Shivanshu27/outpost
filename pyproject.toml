[project]
name = "outpost"
version = "0.1.0"
description = "Job search for engineers outside the US and EU. Local-first, eligibility-aware."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shivanshu Singla" }]
keywords = ["jobs", "job-search", "remote-work", "cli", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "pyyaml>=6.0,<7",
    "structlog>=24.1,<26",
    "tenacity>=8.2,<10",
    "platformdirs>=4.2,<5",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
resume = ["pdfminer.six>=20231228"]

[project.scripts]
outpost = "outpost.cli.main:app"

[project.urls]
Homepage = "https://github.com/Shivanshu27/outpost"
Repository = "https://github.com/Shivanshu27/outpost"
Issues = "https://github.com/Shivanshu27/outpost/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    # Starlette's TestClient requires httpx2; without it the deprecation
    # warning becomes a hard error under our filterwarnings=["error"].
    "httpx2>=2.13",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outpost"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — we are strict about this
    "T20",       # no print() outside the CLI presentation layer
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
]
ignore = [
    "B008",      # FastAPI/Typer depend on call-in-default
    "N818",      # our exceptions are domain signals (QuotaExhausted), not
                 # incidental errors; an "Error" suffix would read worse and
                 # obscure that the pipeline branches on them deliberately.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "S101"]
"src/outpost/cli/**" = ["T20"]
"src/outpost/api/app.py" = ["N806"]  # PEP-8 type aliases for FastAPI deps

[tool.ruff.lint.isort]
known-first-party = ["outpost"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
files = ["src/outpost"]

[[tool.mypy.overrides]]
module = ["pdfminer.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "live: hits real network endpoints; excluded from CI (deselect with '-m \"not live\"')",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/outpost"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------- import-linter
# Enforces the dependency rule from ADR-0003. Without this, layering is a
# convention that decays; with it, a violation fails CI.

[tool.importlinter]
root_package = "outpost"

[[tool.importlinter.contracts]]
name = "Domain is pure (ADR-0003)"
type = "forbidden"
source_modules = ["outpost.domain"]
forbidden_modules = [
    "outpost.adapters",
    "outpost.app",
    "outpost.api",
    "outpost.cli",
    "outpost.config",
]

[[tool.importlinter.contracts]]
name = "Layers point inward (ADR-0003)"
type = "layers"
# The CLI sits above the API rather than beside it: `outpost ui` starts the
# server in-process, so the dependency is real and declaring them siblings
# would have been a lie the linter correctly caught.
layers = [
    "outpost.cli",
    "outpost.api",
    "outpost.config",
    "outpost.app",
    "outpost.adapters",
    "outpost.domain",
]

[[tool.importlinter.contracts]]
name = "Only the composition root reads configuration (ADR-0009)"
type = "forbidden"
source_modules = [
    "outpost.domain",
    "outpost.app",
    "outpost.adapters",
]
forbidden_modules = ["outpost.config"]
